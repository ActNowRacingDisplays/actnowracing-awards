
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branson Turkey Trot | Live Animated Awards</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101827;
  font-family:Arial,sans-serif;
}
.awards{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
  color:white;
  text-align:center;
  padding:2vh 2vw;
}
.eyebrow{
  color:#e8b96a;
  font-size:clamp(11px,1.3vw,20px);
  font-weight:800;
}
h1{
  color:#f6e8cf;
  font-size:clamp(25px,4vw,64px);
  margin:1vh 0;
  text-shadow:0 3px 12px #0005;
}
h2{
  color:#ffbd63;
  font-size:clamp(19px,2.4vw,37px);
  margin:1.5vh 0 3vh;
}
.podium{
  display:flex;
  justify-content:center;
  gap:1.5vw;
  width:100%;
}
.medal{
  position:relative;
  flex:1;
  min-width:0;
  overflow:hidden;
  padding:2.5vh 1vw;
  border-radius:12px;
  color:#171717;
  box-shadow:0 8px 20px #0004;
  animation:rise .8s ease both;
}
.silver{
  background:#c0c0c0;
  animation-delay:.18s;
}
.gold{
  background:#daa520;
  animation-delay:.36s;
}
.bronze{
  background:#b87333;
  animation-delay:.54s;
}
.gold:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    110deg,
    transparent 25%,
    #fff7 45%,
    transparent 60%
  );
  transform:translateX(-180%);
  animation:shimmer 7s ease-in-out infinite 2s;
  pointer-events:none;
}
.place{
  font-size:clamp(27px,4.2vw,67px);
  font-weight:900;
}
.name{
  font-size:clamp(14px,2vw,30px);
  font-weight:800;
  margin:1.6vh 0;
  overflow-wrap:anywhere;
}
.time{
  font-size:clamp(14px,1.8vw,28px);
  font-weight:800;
}
@keyframes rise{
  from{
    opacity:0;
    transform:translateY(35px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
@keyframes shimmer{
  0%,55%,100%{transform:translateX(-180%)}
  75%{transform:translateX(180%)}
}
#status{
  color:#e8b96a;
  font-size:clamp(12px,1.2vw,18px);
  margin-top:1vh;
}

/* Ten-second award countdown */
.countdown{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:4px;
  background:#ffffff22;
}
.countdown-fill{
  height:100%;
  width:100%;
  background:linear-gradient(
    90deg,#b87333,#ffcf57,#f6e8cf
  );
  transform-origin:left;
  animation:countdown 10s linear infinite;
}
@keyframes countdown{
  from{transform:scaleX(1)}
  to{transform:scaleX(0)}
}

/* Three continuous scrolling turkey banners */
.ticker-zone{
  position:absolute;
  bottom:3.5vh;
  left:0;
  width:100%;
  height:min(30vh,255px);
  display:flex;
  flex-direction:column;
  gap:1vh;
  pointer-events:none;
  overflow:hidden;
}
.ticker-row{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:linear-gradient(
    90deg,
    #191b20,
    #292117 20%,
    #292117 80%,
    #191b20
  );
  border-top:1px solid #a47a29;
  border-bottom:1px solid #a47a29;
  box-shadow:0 2px 10px #0007;
}
.ticker-track{
  position:absolute;
  top:0;
  left:0;
  height:100%;
  width:max-content;
  display:flex;
  align-items:center;
  animation:marquee 90s linear infinite;
  will-change:transform;
}
.ticker-row:nth-child(2) .ticker-track{
  animation-duration:105s;
  animation-direction:reverse;
}
.ticker-row:nth-child(3) .ticker-track{
  animation-duration:120s;
}
.ticker-set{
  display:flex;
  align-items:center;
  flex:none;
  white-space:nowrap;
}
.ticker-unit{
  display:inline-flex;
  align-items:center;
  gap:1.1vw;
  padding-right:2.4vw;
  flex:none;
}
.turkey{
  height:clamp(30px,6vh,67px);
  max-width:80px;
  width:auto;
  object-fit:contain;
  filter:drop-shadow(2px 2px 3px #0009);
}
.ticker-text{
  font-size:clamp(17px,2.15vw,34px);
  font-weight:900;
  color:#f7ce4d;
  letter-spacing:.02em;
  text-shadow:
    1px 2px 1px #000,
    0 0 8px #ad752c;
}
.ticker-row:nth-child(2) .ticker-text{
  color:#e9b74b;
}
.ticker-row:nth-child(3) .ticker-text{
  color:#f6d46e;
}
@keyframes marquee{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
.brand{
  position:absolute;
  bottom:.8vh;
  left:0;
  width:100%;
  font-size:clamp(10px,1vw,15px);
  color:#d4b879;
  font-weight:bold;
  letter-spacing:.12em;
}
@media(max-width:600px){
  .awards{padding:2vh 1vw}
  .podium{gap:1vw}
  .medal{padding:2vh .7vw}
  .ticker-zone{height:25vh}
  .ticker-unit{gap:8px;padding-right:16px}
}
@media(max-height:600px){
  .awards{padding-top:1vh}
  h1{margin:0}
  h2{margin:1vh 0}
  .medal{
    padding-top:1vh;
    padding-bottom:1vh;
  }
  .name{margin:1vh 0}
  .ticker-zone{height:28vh}
}
@media(prefers-reduced-motion:reduce){
  .ticker-track{animation-duration:180s}
  .medal{animation:none}
  .gold:after{animation:none}
}
</style>
</head>
<body>
<div class="awards">
  <div class="eyebrow">
    15TH ANNUAL • THANKSGIVING DAY
  </div>

  <h1>BRANSON TURKEY TROT</h1>
  <h2 id="category">LOADING AWARDS...</h2>

  <div class="podium">
    <div class="medal silver">
      <div class="place">2ND</div>
      <div class="name" id="name2">---</div>
      <div class="time" id="time2">---</div>
    </div>

    <div class="medal gold">
      <div class="place">1ST</div>
      <div class="name" id="name1">---</div>
      <div class="time" id="time1">---</div>
    </div>

    <div class="medal bronze">
      <div class="place">3RD</div>
      <div class="name" id="name3">---</div>
      <div class="time" id="time3">---</div>
    </div>
  </div>

  <div id="status"></div>

  <div class="ticker-zone"
       aria-label="Continuous scrolling award banners">
    <div class="ticker-row">
      <div class="ticker-track" id="track0"></div>
    </div>
    <div class="ticker-row">
      <div class="ticker-track" id="track1"></div>
    </div>
    <div class="ticker-row">
      <div class="ticker-track" id="track2"></div>
    </div>
  </div>

  <div class="brand">
    ACTNOWRACING.COM • LIVE RACE RESULTS
  </div>

  <div class="countdown">
    <div class="countdown-fill" id="countdownFill"></div>
  </div>
</div>

<script>
const apiURL =
  "https://api.raceresult.com/406400/PYZOJO8DWOUMSKSHNCDPLR98AS1VE0SO";

const turkeyImage = "branson_turkey_transparent.png";

let categories = [];
let currentIndex = 0;
let lastTickerTitle = "";

function formatTime(value) {
  if (!value) return "---";
  return String(value)
    .replace(/^0:/, "")
    .replace(/\.00$/, "");
}

function getPlace(runner) {
  const formulaKey = Object.keys(runner)
    .find(key => key.startsWith("switch("));

  if (!formulaKey) return null;

  const place = Number(runner[formulaKey]);

  return Number.isInteger(place) &&
         place >= 1 &&
         place <= 3
    ? place
    : null;
}

function buildCategories(data) {
  const groups = new Map();

  data.forEach(runner => {
    const award = runner["Award Category"];
    const gender = runner.Gender;
    const place = getPlace(runner);

    if (!award || !gender || !place) return;

    const isOverall = award === "#Overall";

    const title = isOverall
      ? gender.toUpperCase() + " OVERALL WINNERS"
      : award.toUpperCase();

    const key = (isOverall ? "Overall" : award) +
                "|" + gender;

    if (!groups.has(key)) {
      groups.set(key, {
        title,
        runners: {},
        isOverall
      });
    }

    groups.get(key).runners[place] = runner;
  });

  return Array.from(groups.values());
}

function makeTickerUnit(label) {
  const unit = document.createElement("span");
  unit.className = "ticker-unit";

  const img = document.createElement("img");
  img.className = "turkey";
  img.src = turkeyImage;
  img.alt = "";

  const text = document.createElement("span");
  text.className = "ticker-text";
  text.textContent = "TOP 3 • " + label + " •";

  unit.append(img, text);

  return unit;
}

function updateTickers(title) {
  if (title === lastTickerTitle) return;

  lastTickerTitle = title;

  for (let i = 0; i < 3; i++) {
    const track = document.getElementById("track" + i);
    track.replaceChildren();

    const set = document.createElement("div");
    set.className = "ticker-set";

    for (let j = 0; j < 12; j++) {
      set.appendChild(makeTickerUnit(title));
    }

    track.appendChild(set);
    track.appendChild(set.cloneNode(true));

    track.style.animation = "none";
    void track.offsetWidth;
    track.style.animation = "";
  }
}

function showCategory() {
  if (!categories.length) return;

  if (currentIndex >= categories.length) {
    currentIndex = 0;
  }

  const group = categories[currentIndex];

  document.getElementById("category").textContent =
    group.title;

  for (let place = 1; place <= 3; place++) {
    const runner = group.runners[place];

    document.getElementById("name" + place).textContent =
      runner ? runner.FirstLastname : "---";

    document.getElementById("time" + place).textContent =
      runner ? formatTime(runner.Time) : "---";
  }

  document.querySelectorAll(".medal").forEach(card => {
    card.style.animation = "none";
    void card.offsetWidth;
    card.style.animation = "";
  });

  updateTickers(group.title);

  const bar = document.getElementById("countdownFill");
  bar.style.animation = "none";
  void bar.offsetWidth;
  bar.style.animation = "";
}

async function loadResults() {
  try {
    const response = await fetch(apiURL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Unexpected JSON format");
    }

    const updated = buildCategories(data);

    if (!updated.length) {
      throw new Error("No award categories found");
    }

    const currentTitle =
      categories[currentIndex]?.title;

    categories = updated;

    const matchingIndex = categories.findIndex(
      category => category.title === currentTitle
    );

    currentIndex = matchingIndex >= 0
      ? matchingIndex
      : 0;

    showCategory();

    document.getElementById("status").textContent = "";

  } catch (error) {
    document.getElementById("status").textContent =
      "Waiting for updated race results...";

    console.error("Awards update failed:", error);
  }
}

loadResults();

setInterval(() => {
  if (!categories.length) return;

  currentIndex =
    (currentIndex + 1) % categories.length;

  showCategory();
}, 10000);

setInterval(loadResults, 30000);
</script>
</body>
</html>
